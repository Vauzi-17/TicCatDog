<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tiktakto - A minimalist tic-tac-toe game with AI opponent and global leaderboard">
  <meta property="og:title" content="Tiktakto - Play Tic-Tac-Toe">
  <meta property="og:description" content="Challenge the AI in this beautifully crafted tic-tac-toe game">
  <title>Tiktakto - Tic-Tac-Toe Reimagined</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
            <path d="M3 3h6v6H3V3zm8 0h6v6h-6V3zm8 0h6v6h-6V3zM3 11h6v6H3v-6zm8 0h6v6h-6v-6zm8 0h6v6h-6v-6zM3 19h6v6H3v-6zm8 0h6v6h-6v-6zm8 0h6v6h-6v-6z"/>
          </svg>
          <span class="logo-text">Tiktakto</span>
        </div>
        <nav class="nav-links">
          <button class="nav-item" id="navPlay">Play</button>
          <button class="nav-item" id="navLeader">Scores</button>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <section class="game-section" id="gameSection">
        <div class="section-header">
          <h1 class="title">Tick, Tack, Toe.</h1>
          <p class="subtitle">You versus the machine. Who wins?</p>
        </div>

        <div class="game-wrapper">
          <div class="game-info">
            <div class="player-info">
              <h2 id="playerName" class="player-label">You</h2>
              <div id="playerScore" class="score">0</div>
            </div>
            <div class="vs-separator">
              <span class="vs-text">vs</span>
            </div>
            <div class="ai-info">
              <h2 class="player-label">AI</h2>
              <div id="aiScore" class="score">0</div>
            </div>
          </div>

          <div class="board-container">
            <div id="gameBoard" class="board">
              <button class="square" data-index="0" aria-label="Square 1"></button>
              <button class="square" data-index="1" aria-label="Square 2"></button>
              <button class="square" data-index="2" aria-label="Square 3"></button>
              <button class="square" data-index="3" aria-label="Square 4"></button>
              <button class="square" data-index="4" aria-label="Square 5"></button>
              <button class="square" data-index="5" aria-label="Square 6"></button>
              <button class="square" data-index="6" aria-label="Square 7"></button>
              <button class="square" data-index="7" aria-label="Square 8"></button>
              <button class="square" data-index="8" aria-label="Square 9"></button>
            </div>
          </div>

          <div class="game-controls">
            <div id="statusMessage" class="status-message">Game starting...</div>
            <button id="newGameBtn" class="button button-primary">New Game</button>
            <button id="resetBtn" class="button button-secondary">Clear Stats</button>
          </div>
        </div>
      </section>

      <section class="leaderboard-section" id="leaderboardSection" style="display: none;">
        <div class="section-header">
          <h1 class="title">Global Leaderboard</h1>
          <p class="subtitle">Top players in the Tiktakto arena</p>
        </div>

        <div class="leaderboard-container">
          <div id="leaderboardList" class="leaderboard-list">
            <div class="empty-state">
              <p>No scores yet. Be the first to play!</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>
        <span class="footer-detail">A game of strategy, timing, and perhaps luck.</span>
        <span class="footer-divider">•</span>
        <span class="footer-detail">Made with care.</span>
      </p>
    </footer>
  </div>

  <script defer src="game.js"></script>
</body>
</html>
